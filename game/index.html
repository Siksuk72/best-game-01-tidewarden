<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDEWARDEN — Hold the Last Harbor</title>
<meta name="description" content="A tiny original tower-defence game: hold the last harbor against 30 waves of drowned horrors. Pure canvas, no downloads.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <canvas id="game" width="1280" height="720" aria-label="TIDEWARDEN game canvas"></canvas>
  <p class="hint">Mouse to build &amp; upgrade · 1–6 towers · Space start wave · Q surge · E flare · F speed · P pause · M mute · R restart</p>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
